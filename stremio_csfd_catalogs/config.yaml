name: "Stremio CSFD katalogy"
version: "1.0.6"
slug: "stremio_csfd_catalogs"
description: "Lokalni Stremio addon pro katalogy filmu z CSFD"
arch:
  - aarch64
init: false
startup: services
boot: auto

ports:
  7010/tcp: 7010
  7450/tcp: 7450

ports_description:
  7010/tcp: "HTTP Stremio manifest a API"
  7450/tcp: "HTTPS Stremio manifest a API"

map:
  - type: share
    read_only: false
  - type: ssl
    read_only: true

options:
  addon_version: "1.0.6"
  addon_build_signature: "1.0.6-trakt-cloudflare-fix-2026-05-03"
  host_ip: "192.168.1.197"

  http_enabled: true
  http_port: 7010

  https_enabled: false
  https_port: 7450
  https_auto_self_signed: true
  https_certfile: "/ssl/fullchain.pem"
  https_keyfile: "/ssl/privkey.pem"

  addon_name: "CSFD katalogy"
  addon_id: "community.csfd.catalogs.local"

  csfd_enabled: true
  csfd_refresh_on_start: true
  csfd_api_mode: "internal"
  trakt_enabled: false
  trakt_client_id: ""
  trakt_client_secret: ""
  tmdb_enabled: true
  tmdb_api_read_access_token: ""
  tmdb_language: "cs-CZ"
  tmdb_fallback_language: "en-US"
  csfd_detail_concurrency: 2
  csfd_catalog_prefetch_count: 12
  csfd_background_hydration_enabled: true
  csfd_background_hydration_limit: 0
  csfd_list_refresh_interval_hours_default: 24
  csfd_detail_cache_ttl_days: 30
  csfd_request_delay_ms: 800

  csfd_catalogs:
    - id: "csfd_cz_sk_pohadky"
      name: "CSFD - ceske a slovenske pohadky"
      enabled: true
      source_type: "csfd_html_list"
      source_url: "https://www.csfd.cz/podrobne-vyhledavani/?&sort=year"
      refresh_interval_hours: 24
      max_pages: 20
      max_items: 500
      stremio_type: "movie"
      include_future_titles: false
      filter_enabled: true
      filter_allowed_origins:
        - "Cesko"
        - "Slovensko"
        - "Ceskoslovensko"
      filter_required_genres:
        - "Pohadka"
      filter_allowed_types:
        - "Film"
        - "TV film"

schema:
  addon_version: "str"
  addon_build_signature: "str"
  host_ip: "str"

  http_enabled: "bool"
  http_port: "port"

  https_enabled: "bool"
  https_port: "port"
  https_auto_self_signed: "bool"
  https_certfile: "str"
  https_keyfile: "str"

  addon_name: "str"
  addon_id: "str"

  csfd_enabled: "bool"
  csfd_refresh_on_start: "bool"
  csfd_api_mode: "list(internal|external)"
  csfd_api_base_url: "str?"
  trakt_enabled: "bool"
  trakt_client_id: "str"
  trakt_client_secret: "password"
  tmdb_enabled: "bool"
  tmdb_api_read_access_token: "password"
  tmdb_language: "str"
  tmdb_fallback_language: "str"
  csfd_detail_concurrency: "int(1,5)"
  csfd_catalog_prefetch_count: "int(0,50)"
  csfd_background_hydration_enabled: "bool"
  csfd_background_hydration_limit: "int(0,5000)"
  csfd_list_refresh_interval_hours_default: "int(6,168)"
  csfd_detail_cache_ttl_days: "int(1,365)"
  csfd_request_delay_ms: "int(0,5000)"

  csfd_catalogs:
    - id: "str"
      name: "str"
      enabled: "bool"
      source_type: "list(csfd_html_list|json_file|csv_file|external_script)"
      source_url: "str?"
      source_file: "str?"
      script_path: "str?"
      script_output: "str?"
      refresh_interval_hours: "int(6,168)"
      max_pages: "int(1,100)"
      max_items: "int(1,5000)"
      stremio_type: "list(movie|series)"
      include_future_titles: "bool"
      filter_enabled: "bool"
      filter_allowed_origins:
        - "str"
      filter_required_genres:
        - "str"
      filter_allowed_types:
        - "str"
